site_name: Apuntes Ciber
site_url: https://manelca.github.io/

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Inicio: index.md
  - OSINT:
      - theHarvester: enum/theHarvester.md
      - Passive recon: enum/passive-recon.md
      - Port scanning: enum/port-scanning.md
  - Web:
      - Initial methodology: web/initial-methodology.md
