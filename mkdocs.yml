site_name: Apuntes Ciber
site_url: https://manelca.github.io/

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Inicio: index.md
  - OSINT:
      - theHarvester: OSINT/theHarvester.md
      - TruffleHog: OSINT/TruffleHog.md
      - Exiftool: OSINT/Exiftool.md
      - JohnTheRipper: OSINT/JohnTheRipper.md
      - dnsenum: OSINT/dnsenum.md
      - h8mail: OSINT/h8mail.md
      - nmap: OSINT/nmap.md
      - whois: OSINT/whois.md
  - Web:
      - Initial methodology: web/initial-methodology.md
